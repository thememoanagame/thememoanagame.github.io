name: Deploy 

on:
  push:
    branches: [ main ] 
    tags: 
      - 'v*'  
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout 
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x' 

    - name: Publish
      run: dotnet publish ./src/TheMemoAnaGame/TheMemoAnaGame.csproj -c Release -o release /p:BlazorEnableCompression=false

    - name: Setup base path
      if: startsWith(github.ref, 'refs/tags/v')
      run: |        
        touch release/wwwroot/.nojekyll
        
    - name: Deploy to GitHub Pages
      if: startsWith(github.ref, 'refs/tags/v')
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: release/wwwroot 
        branch: gh-pages 
        clean: true 